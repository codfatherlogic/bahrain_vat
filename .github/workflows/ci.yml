
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-bahrain_vat-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # crenya's shared Frappe CI: own ports + bench per job on crenya-ci, a saved Frappe/ERPNext site,
  # fails when no tests ran. One fix there reaches every app.
  tests:
    uses: codfatherlogic/ci-workflows/.github/workflows/frappe-app.yml@v1
    with:
      app: bahrain_vat
      frappe_versions: '["version-15"]'
      draft_frappe_versions: '["version-15"]'
      erpnext: true  # uses Account, Item, Sales Taxes and Charges (required_apps is commented out)
      runs_on: '"ubuntu-latest"'
      require_tests: false  # no Frappe tests in the app yet; the check proves it installs
